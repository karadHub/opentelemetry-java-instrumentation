name: Create Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Match tags in the format v1.1.3

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Spotless Linting
        run: |
          cd examples/extension
          ./gradlew :spotlessApply

      - name: Build JAR
        run: |
          cd examples/extension
          ./gradlew build

      - name: Modify Tag name
        id: get-tag
        run: |
          TAG_NAME=${{ github.ref }}
          if [[ $TAG_NAME == refs/*/v* ]]; then
            MODIFIED_TAG=${TAG_NAME#refs/*/v}
          fi
          echo "modified_tag=$MODIFIED_TAG" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}
            
            Built with Java 21
          draft: false
          prerelease: false
          files: |
            ./examples/extension/build/libs/middleware-javaagent.jar
          fail_on_unmatched_files: true
